<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracing an LLM API Request</title>
<style>
@font-face{font-family:JBM;font-weight:400;src:url(../../assets/fonts/JetBrainsMono-Regular.ttf) format("truetype")}
@font-face{font-family:JBM;font-weight:700;src:url(../../assets/fonts/JetBrainsMono-Bold.ttf) format("truetype")}
:root{--bg:#060A13;--ink:#E8EEF9;--muted:#7484A6}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:JBM,ui-monospace,monospace}
#wrap{position:relative;width:fit-content;margin:0 auto}
#stage{display:block;position:relative;z-index:1;max-width:100vw;max-height:calc(100vh - 60px)}
#gl{position:absolute;left:0;top:0}
#bar{display:flex;gap:12px;align-items:center;max-width:900px;margin:8px auto;padding:0 16px}
#bar button{font:inherit;padding:6px 14px;border-radius:999px;border:1px solid var(--muted);background:#0D1628;color:var(--ink);cursor:pointer}
#bar input{flex:1}
#time{min-width:110px;text-align:right;color:var(--muted)}
html.capture,html.capture body{overflow:hidden}
html.capture #bar{display:none}
html.capture #stage,html.capture #gl{width:100vw;height:100vh;max-height:none}
</style>
<script>if(/[?&]capture/.test(location.search))document.documentElement.classList.add('capture')</script>
<script src="../../node_modules/three/build/three.min.js"></script>
<script src="../shared/world3d.js"></script>
</head>
<body>
<div id="wrap"><canvas id="gl"></canvas><canvas id="stage" aria-label="Tracing an LLM API request: one request travels from a chat box through the gateway, tokenizer, router, a batched GPU, prefill and decode, with explainers for prompt caching, continuous batching, the KV cache, speculative decoding, prefill/decode disaggregation and streaming."></canvas></div>
<div id="bar"><button id="play">⏸</button><input id="scrub" type="range" min="0" step="0.01" value="0"><span id="time"></span></div>
<script type="module">
await Promise.all([document.fonts.load('400 40px JBM'), document.fonts.load('700 40px JBM')]);
/* The full video, a pure function of time: seek(r) draws the frame at r real seconds. 3D and 2D combined:
   the journey (hook → prefill → decode) is the promo's 3D world (../shared/world3d.js, driven by the story time `jt(r)`),
   and the concept explainers (prompt caching in blocks, continuous batching, KV cache, speculative decoding, disaggregation, streaming) pause the journey for 2D diagrams.
   Landscape 16:9 only. All timings, token counts and ids are examples. */
const CAPTURE = document.documentElement.classList.contains('capture');
const P = false, W = 1920, H = 1080, CX = 960, CY = 540;

/* ---------- the timeline: chapters in real seconds ---------- */
const CH = { hook: [0, 7], net: [7, 11], gate: [11, 18], tok: [18, 25], route: [25, 34], blocks: [34, 62], queue: [62, 71], batch: [71, 89],
  prefill: [89, 98], kv: [98, 132], dec1: [132, 144], spec: [144, 175], disagg: [175, 207], dec2: [207, 214], stream: [214, 228],
  recap: [228, 244], end: [244, 251] };
const DURATION = CH.end[1];
// the journey's story time (the promo's clock: 4 send ... 14 prefill, 17 decode, 22 stop) at real seconds: [r0, r1, s0, s1]
const JMAP = [[...CH.net, 4, 6], [...CH.gate, 6, 8], [...CH.tok, 8, 10], [...CH.route, 10, 12], [...CH.queue, 12, 14],
  [...CH.prefill, 14, 16.5], [...CH.dec1, 16.5, 20], [...CH.dec2, 20, 22]];
const jt = r => { const m = JMAP.find(([a, b]) => r >= a && r < b); return m ? m[2] + (m[3] - m[2]) * (r - m[0]) / (m[1] - m[0]) : null; };
const JOURNEY = [[CH.net[0], CH.route[1]], CH.queue, CH.prefill, CH.dec1, CH.dec2];             // where the stopwatch, stage title and timeline show

const C = { bg: '#060A13', panel: '#0D1628', grid: '#1B2B4B', dim: '#2A3A5E', cyan: '#3BE4FF', violet: '#A08CFF',
  amber: '#FFB547', green: '#41E88F', red: '#FF5A76', pink: '#FF7AD9', ink: '#E8EEF9', muted: '#7C8CAE' };

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const eOC = u => 1 - (1 - u) ** 3, eIn = u => u * u * u, eIO = u => u < .5 ? 4 * u * u * u : 1 - (-2 * u + 2) ** 3 / 2;
const eOB = u => { const c = 1.9; return 1 + (c + 1) * (u - 1) ** 3 + c * (u - 1) ** 2; };
const bump = (t, a, b) => (t < a || t > b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
let seed = 11;
const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
let PX = 1, GA = 1;                                       // device px per logical px; a scene-wide alpha (cross-fades inside a scene)
function fit() {
  const dpr = window.devicePixelRatio || 1;
  let cw = innerWidth, ch = innerHeight;
  if (!CAPTURE) { ch -= 60; if (cw / ch > W / H) cw = ch * W / H; else ch = cw * H / W; cv.style.width = cw + 'px'; cv.style.height = ch + 'px'; }
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr); PX = cv.width / W;
}
fit();
const font = (size, w = 400) => { ctx.font = `${w} ${size}px JBM`; };
const glow = (color, b) => { ctx.shadowColor = color; ctx.shadowBlur = b * PX; };
const noGlow = () => { ctx.shadowBlur = 0; };
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(s, x, y, size, color, o = {}) {
  font(size, o.w || 400); ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = (o.a ?? 1) * GA; ctx.fillStyle = color;
  if (o.glow) glow(color, o.glow);
  ctx.fillText(s, x, y); noGlow(); ctx.globalAlpha = 1;
}
const tw = (s, size, w = 400) => { font(size, w); return ctx.measureText(s).width; };
function blob(x, y, r, color, a) {                        // soft additive light
  if (a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'transparent');
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a * GA; ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore();
}
function packet(x, y, r, color = C.cyan, a = 1) {
  blob(x, y, r * 6, color, .45 * a);
  ctx.globalAlpha = a * GA; glow(color, 24);
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = '#F4FDFF'; ctx.fill();
  ctx.lineWidth = r * .35; ctx.strokeStyle = color; ctx.stroke(); noGlow(); ctx.globalAlpha = 1;
}
function trail(x, y, len, r, color, a = 1) {              // comet tail to the left of (x, y)
  const g = ctx.createLinearGradient(x - len, y, x, y);
  g.addColorStop(0, 'transparent'); g.addColorStop(1, color);
  ctx.globalAlpha = .7 * a * GA; ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(x - len, y); ctx.lineTo(x, y - r); ctx.lineTo(x, y + r); ctx.fill(); ctx.globalAlpha = 1;
}
function ring(x, y, u, rMax, color, w = 4) {              // a burst ring, u 0..1
  if (u <= 0 || u >= 1) return;
  ctx.globalAlpha = (1 - u) * GA; ctx.lineWidth = w * (1 - u) + 1; ctx.strokeStyle = color; glow(color, 16);
  ctx.beginPath(); ctx.arc(x, y, rMax * eOC(u), 0, 7); ctx.stroke(); noGlow(); ctx.globalAlpha = 1;
}
function chip(s, x, y, size, color, o = {}) {             // a rounded token chip centred at (x, y); returns its width
  const w = tw(s, size, 700) + size * .8, h = size * 1.5, sc = o.scale ?? 1, a = o.a ?? 1;
  if (a <= 0) return w;
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.globalAlpha = a * GA;
  rr(-w / 2, -h / 2, w, h, h * .28);
  ctx.fillStyle = o.fill || C.panel; if (o.lit) glow(color, 22 * o.lit); ctx.fill(); noGlow();
  ctx.lineWidth = 2.5; ctx.strokeStyle = color;
  if (o.dash) ctx.setLineDash([8, 7]);
  ctx.stroke(); ctx.setLineDash([]);
  ctx.restore(); ctx.globalAlpha = 1;
  text(s, x, y + 1, size * sc, o.ink || C.ink, { w: 700, a });
  return w;
}
function box(x, y, w, h, fill, stroke, o = {}) {          // a filled rounded rect, top-left corner at (x, y)
  ctx.globalAlpha = (o.a ?? 1) * GA; rr(x, y, w, h, o.r ?? 8);
  if (fill) { ctx.fillStyle = fill; if (o.glow) glow(o.glowColor || stroke || fill, o.glow); ctx.fill(); noGlow(); }
  if (stroke) { ctx.lineWidth = o.lw ?? 2.5; ctx.strokeStyle = stroke; if (o.dash) ctx.setLineDash(o.dash); ctx.stroke(); ctx.setLineDash([]); }
  ctx.globalAlpha = 1;
}
function line(x0, y0, x1, y1, color, w = 3, a = 1, dash = null) {
  ctx.globalAlpha = a * GA; ctx.strokeStyle = color; ctx.lineWidth = w; if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
}
function gpuIcon(x, y, s, color, lit = 0, a = 1) {        // a small GPU chip: square with pins, centred at (x, y)
  ctx.globalAlpha = a * GA; ctx.lineWidth = 3; ctx.strokeStyle = lit > .05 ? color : C.dim;
  rr(x - s / 2, y - s / 2, s, s, 10); ctx.fillStyle = C.panel; if (lit > .05) glow(color, 26 * lit); ctx.fill(); noGlow(); ctx.stroke();
  for (let k = -1; k <= 1; k++) for (const [ax, ay, bx, by] of [[x + k * s * .26, y - s / 2, x + k * s * .26, y - s / 2 - 9], [x + k * s * .26, y + s / 2, x + k * s * .26, y + s / 2 + 9], [x - s / 2, y + k * s * .26, x - s / 2 - 9, y + k * s * .26], [x + s / 2, y + k * s * .26, x + s / 2 + 9, y + k * s * .26]]) { ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); }
  if (lit > .05) { ctx.fillStyle = color; ctx.globalAlpha = a * GA * (.25 + .5 * lit); rr(x - s * .22, y - s * .22, s * .44, s * .44, 6); ctx.fill(); }
  ctx.globalAlpha = 1;
}
function gauge(x, y, w, label, v, color, a = 1) {         // a labelled horizontal bar
  text(label, x, y, 20, C.muted, { align: 'left', a });
  box(x + 150, y - 8, w, 16, '#111C30', null, { a, r: 8 });
  if (v > 0) box(x + 150, y - 8, w * v, 16, color, null, { a, r: 8, glow: 10 });
}

/* ---------- content (illustrative) ---------- */
const PROMPT = 'Why is the sky blue?';
const TOKENS = [['Why', 10445], ['is', 382], ['the', 290], ['sky', 13181], ['blue', 9861], ['?', 30]];
const OUT = ['Sunlight', 'scatters', 'off', 'air', 'molecules,', 'and', 'blue', 'light', 'scatters', 'the', 'most,',
  'so', 'the', 'whole', 'sky', 'looks', 'blue', 'to', 'you', '.'];
const T_FIRST = 16.0, T_DEC = 17.0, STEP = 0.25, T_EOS = 22.0;   // story seconds: first token, decode start, one token per step, stop
const SW = [[4, 0], [6, .030], [8, .045], [10, .048], [12, .055], [14, .180], [16, .420], [22, 2.140]];   // stopwatch (s of the request's life) at story times
const STAGES = [['network', .030, C.muted], ['gateway', .015, C.green], ['tokenize', .003, C.violet], ['route', .007, C.pink],
  ['queue', .125, C.amber], ['prefill', .240, C.cyan], ['decode', 1.720, C.violet]];
const swAt = t => { if (t <= SW[0][0]) return 0; for (let i = 1; i < SW.length; i++) if (t <= SW[i][0]) { const [a, va] = SW[i - 1], [b, vb] = SW[i]; return lerp(va, vb, (t - a) / (b - a)); } return SW.at(-1)[1]; };
const TOKCOL = [C.cyan, '#5FD0FF', '#7FB8FF', C.violet, '#C08CFF', C.pink];
const step = t => Math.min(OUT.length - 1, Math.floor((t - T_DEC) / STEP) + 1);   // index of the newest output token (world3d.js)

/* ---------- 2D chrome ---------- */
function background(r) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C.grid; ctx.globalAlpha = .55;
  const sp = 64, ox = -((r * 14) % sp), oy = (r * 6) % sp;
  for (let x = ox; x < W + sp; x += sp) for (let y = oy - sp; y < H + sp; y += sp) ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
  ctx.globalAlpha = 1;
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, W * .75);
  v.addColorStop(0, 'transparent'); v.addColorStop(1, 'rgba(0,0,0,.75)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
function heading(u, name, sub) {                          // the explainer's title, top centre
  const a = eOC(seg(u, .1, .6)), y = 84 + 12 * (1 - a);
  const bw = Math.max(tw(name, 54, 700), tw(sub, 26)) + 120;
  const g = ctx.createLinearGradient(0, y - 60, 0, y + 90); g.addColorStop(0, 'rgba(6,10,19,0)'); g.addColorStop(.3, 'rgba(6,10,19,.75)'); g.addColorStop(.8, 'rgba(6,10,19,.75)'); g.addColorStop(1, 'rgba(6,10,19,0)');
  ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(CX - bw / 2, y - 60, bw, 150); ctx.globalAlpha = 1;
  text(name, CX, y, 54, C.ink, { w: 700, a, glow: 18 });
  text(sub, CX, y + 54, 26, C.cyan, { a: a * seg(u, .3, .8) });
}
// captions: [from, to, text, color?] in the scene's (or the video's) seconds; '\n' starts a second line
function caption(u, items, y = H - 120) {
  for (const [a, b, s, col] of items) {
    const al = seg(u, a, a + .35) * (1 - seg(u, b - .35, b)); if (al <= 0) continue;
    const lines = s.split('\n'), sz = 32, lh = 44, bw = Math.max(...lines.map(l => tw(l, sz))) + 90, bh = lines.length * lh + 22;
    box(CX - bw / 2, y - lh / 2 - 8, bw, bh, 'rgba(6,10,19,.72)', null, { a: al, r: 18 });
    lines.forEach((l, i) => text(l, CX, y + i * lh + 2 * (1 - al), sz, col || C.ink, { a: al }));
  }
}
const sub = (u, a, b, fadeOut = true) => { GA = seg(u, a, a + .5) * (fadeOut ? 1 - seg(u, b - .5, b) : 1); return GA > .005; };   // a cross-faded part of a scene

/* ---------- 0 · hook: the question, the prompt is typed and sent (the same opening as the promo) ---------- */
const BOX = { w: 1000, h: 120 }; BOX.x = CX - BOX.w / 2; BOX.y = CY + 60;
const BTN = { x: BOX.x + BOX.w - BOX.h / 2, y: BOX.y + BOX.h / 2, r: BOX.h / 2 - 14 };
const pk0 = t => ({ x: BTN.x, y: BTN.y - 8 * Math.sin(t * 3) * seg(t, 2.3, 2.8) });
function hook(r) {                                        // t: the promo's opening clock, 0..4, stretched over 7 real seconds
  const t = r * 4 / 7, fade = 1 - seg(t, 3.3, 3.8);
  ctx.globalAlpha = fade;
  rr(BOX.x, BOX.y, BOX.w, BOX.h, BOX.h / 2); ctx.fillStyle = C.panel; glow(C.cyan, 10 + 20 * bump(t, 1.9, 2.4)); ctx.fill(); noGlow();
  ctx.lineWidth = 2; ctx.strokeStyle = C.dim; ctx.stroke(); ctx.globalAlpha = 1;
  const n = Math.floor(seg(t, .35, 1.55) * PROMPT.length + .001), typed = PROMPT.slice(0, n);
  const k = eIO(seg(t, 2.0, 2.3)), sz = 44;
  text(typed, BOX.x + 56 + k * (BOX.w - 240), BOX.y + BOX.h / 2, sz, C.ink, { align: 'left', a: (1 - k) * fade });
  if (t < 2 && (n < PROMPT.length || Math.floor(t * 2.4) % 2 === 0)) {
    ctx.fillStyle = C.cyan; ctx.globalAlpha = fade;
    ctx.fillRect(BOX.x + 60 + tw(typed, sz), BOX.y + BOX.h / 2 - sz * .55, 4, sz * 1.1); ctx.globalAlpha = 1;
  }
  const ready = seg(t, 1.5, 1.6), press = 1 - .18 * bump(t, 1.9, 2.15);
  ctx.save(); ctx.translate(BTN.x, BTN.y); ctx.scale(press, press); ctx.globalAlpha = fade;
  ctx.beginPath(); ctx.arc(0, 0, BTN.r, 0, 7); ctx.fillStyle = ready > 0 ? C.cyan : C.dim; if (ready) glow(C.cyan, 18); ctx.fill(); noGlow();
  ctx.strokeStyle = C.bg; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath();
  ctx.moveTo(0, 14); ctx.lineTo(0, -14); ctx.moveTo(-12, -2); ctx.lineTo(0, -14); ctx.lineTo(12, -2); ctx.stroke(); ctx.restore(); ctx.globalAlpha = 1;
  ring(BTN.x, BTN.y, seg(t, 2.0, 2.5), 160, C.cyan);
  if (t > 2.05) { const p = pk0(t); packet(p.x, p.y, 16 * eOB(seg(t, 2.05, 2.4))); }
  const ask = eOC(seg(t, .1, .5)) * (1 - seg(t, 2.0, 2.25)), ay = CY - 200;
  ['What happens when we send', 'a request to an LLM?'].forEach((s, i) => text(s, CX, ay + (i - .5) * 80 + 16 * (1 - ask), 62, C.ink, { w: 700, a: ask }));
  const qa = eOC(seg(t, 2.35, 2.85)) * fade, qy = CY - 170 + 24 * (1 - qa), s1 = "Let's trace this ", x0 = CX - tw(s1 + 'request', 68, 700) / 2;
  text(s1, x0, qy, 68, C.ink, { w: 700, a: qa, align: 'left' });
  text('request', x0 + tw(s1, 68, 700), qy, 68, C.cyan, { w: 700, a: qa, align: 'left', glow: 18 });
}
const hookCam = r => { const t = r * 4 / 7, p = pk0(t), u = eIO(seg(t, 3.1, 3.8)); return { x: lerp(CX, p.x, u), y: lerp(CY, p.y, u), s: 1 + 5 * eIn(seg(t, 3.2, 4.0)) }; };

/* ---------- the KV cache (2D, 34 s): keys and values; without a cache; with a cache; prompt caching ---------- */
const GRID = { x0: 560, y0: 280, cw: 54, ch: 46, gap: 6, rows: 6 };
const cellX = j => GRID.x0 + j * (GRID.cw + GRID.gap), cellY = s => GRID.y0 + s * (GRID.ch + GRID.gap + 0);
const rowLen = s => 6 + s;                                // history + the new token, for decode step s
const cum = k => { let n = 0; for (let s = 0; s <= k; s++) n += rowLen(s); return n; };   // cells recomputed with no cache: 6, 13, 21, 30, 40, 51
function kvScene(u) {
  heading(u, 'the KV cache', 'keys and values: compute once, reuse every step');
  // A · every token becomes a key and a value; the next token looks back at all of them
  if (sub(u, 0, 8)) {
    const xs = i => CX + (i - 3) * 190, y = 360, words = [...TOKENS.map(t => t[0]), 'next'];
    words.forEach((w, i) => { const a = seg(u, .3 + i * .12, .6 + i * .12); chip(w, xs(i), y, 38, i < 6 ? TOKCOL[i] : C.violet, { scale: eOB(a), a, dash: i === 6, lit: i === 6 ? bump(u, 4.8, 7.8) : 0 }); });
    for (let i = 0; i < 6; i++) {
      const a = eOB(seg(u, 1.6 + i * .25, 2.1 + i * .25));
      for (const [dx, name, col] of [[-26, 'K', C.amber], [26, 'V', C.cyan]]) {
        if (a <= 0) continue;
        ctx.save(); ctx.translate(xs(i) + dx, 480); ctx.scale(a, a); box(-20, -25, 40, 50, col, null, { glow: 12, a: Math.min(1, a) }); ctx.restore();
        text(name, xs(i) + dx, 481, 26 * a, C.bg, { w: 700, a: Math.min(1, a) });
      }
      line(xs(i), y + 36, xs(i) - 26, 452, TOKCOL[i], 2, seg(u, 1.6 + i * .25, 2 + i * .25) * .6);
      line(xs(i), y + 36, xs(i) + 26, 452, TOKCOL[i], 2, seg(u, 1.6 + i * .25, 2 + i * .25) * .6);
    }
    text('K: how a token can be found', xs(0) - 40, 590, 24, C.amber, { align: 'left', a: seg(u, 3.4, 3.9) });
    text('V: what it passes on', xs(0) - 40, 630, 24, C.cyan, { align: 'left', a: seg(u, 3.7, 4.2) });
    const wts = [.15, .1, .1, .6, 1, .35];                // how much the next token attends to each (example weights)
    wts.forEach((wt, i) => {
      const a = seg(u, 5.0 + i * .15, 5.5 + i * .15), x1 = xs(i) - 26, x0 = xs(6);
      if (a <= 0) return;
      ctx.globalAlpha = a * GA * (.3 + .7 * wt); ctx.strokeStyle = C.violet; ctx.lineWidth = 2 + 7 * wt; glow(C.violet, 10 * wt);
      ctx.beginPath(); ctx.moveTo(x0, y + 36); ctx.quadraticCurveTo((x0 + x1) / 2, 640 + 30 * i, x1, 508); ctx.stroke(); noGlow(); ctx.globalAlpha = 1;
    });
    text('asks: which tokens matter?', xs(6) - 40, y - 56, 20, C.violet, { a: seg(u, 4.6, 5.1) });
    caption(u, [[.5, 4.3, 'Every token in the prompt is turned into a key (K) and a value (V).'], [4.5, 7.9, "To write the next token, the model looks back at every K\nand mixes in the V's of the tokens that matter."]]);
  }
  // B · without a cache, each step recomputes K and V for the whole history
  if (sub(u, 8, 16)) {
    const v = u - 8, G = GRID;
    for (let s = 0; s < G.rows; s++) {
      const t0 = .6 + s * 1.0, a = seg(v, t0, t0 + .3);
      if (a <= 0) continue;
      text(`step ${s + 1}`, G.x0 - 22, cellY(s) + G.ch / 2, 20, C.muted, { align: 'right', a });
      for (let j = 0; j < rowLen(s); j++) {
        const ca = seg(v, t0 + j * .03, t0 + j * .03 + .15), newest = j === rowLen(s) - 1, flash = 1 - seg(v, t0 + .1, t0 + 1);

  ctx.globalAlpha = a; ctx.strokeStyle = C.ink; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(x + 22, y + 2, 20, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 22, y + 2); const ang = v * 6 - Math.PI / 2; ctx.lineTo(x + 22 + 13 * Math.cos(ang), y + 2 + 13 * Math.sin(ang)); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.fillRect(x + 17, y - 26, 10, 6); ctx.globalAlpha = 1;
  text(`${v.toFixed(3)} s`, x + 60, y + 2, 44, C.ink, { w: 700, align: 'left', a });
  text('example timings', x, y + 48, 20, C.muted, { align: 'left', a });
  if (t > T_FIRST) chip('first token  0.42 s', x + 440, y + 2, 22, C.amber, { ink: C.amber, a: a * seg(t, T_FIRST, T_FIRST + .1), scale: eOB(seg(t, T_FIRST, T_FIRST + .3)), lit: 1 - seg(t, 16.2, 17) });

const TL_STAGES = [['network', 4, 6], ['gateway', 6, 8], ['tokens', 8, 10], ['router', 10, 12], ['queue', 12, 14], ['prefill', 14, T_FIRST], ['decode', T_FIRST, T_EOS]];
const TL = { x: 210, w: 1500, y: H - 72, s: 22 };
const fmt = v => v < 1 ? `${Math.round(v * 1000)} ms` : `${v.toFixed(2)} s`;
function timeline(t, ha) {
  const a = seg(t, 4.1, 4.4) * ha; if (a <= 0) return;
  const gap = 8, sw = (TL.w - gap * (TL_STAGES.length - 1)) / TL_STAGES.length;
  TL_STAGES.forEach(([name, s0, s1], i) => {
    const x = TL.x + i * (sw + gap), cur = t >= s0 && t < s1, done = t >= s1, u = seg(t, s0, s1);
    ctx.globalAlpha = a; rr(x, TL.y - 5, sw, 10, 5); ctx.fillStyle = '#16233D'; ctx.fill();
    if (u > 0) { rr(x, TL.y - 5, sw * u, 10, 5); ctx.fillStyle = STAGES[i][2]; if (cur) glow(STAGES[i][2], 14); ctx.fill(); noGlow(); }
    ctx.globalAlpha = 1;
    text(name, x + sw / 2, TL.y - TL.s - (cur ? 10 : 4), cur ? TL.s * 1.35 : TL.s, cur ? C.ink : done ? STAGES[i][2] : C.muted, { w: cur ? 700 : 400, a: a * (cur || done ? 1 : .7), glow: cur ? 10 : 0 });
    if (u > 0) text(fmt(swAt(Math.min(t, s1)) - swAt(s0)), x + sw / 2, TL.y + TL.s + 6, TL.s - 2, C.muted, { a: a * Math.min(1, u * 4) });
  });
}

/* ---------- 3D: the journey is drawn by world3d.js (this canvas stays on top, transparent) ---------- */
Object.assign(window, { C, P, W, H, PROMPT, TOKENS, OUT, TOKCOL, T_DEC, STEP, step, seg, lerp, clamp, bump, eOC, eIn, eIO, eOB, rnd });   // world3d.js reads these
const world = makeWorld3d(document.getElementById('gl'));
function fitAll() { fit(); world.resize(cv.width, cv.height); const g = document.getElementById('gl'); g.style.width = cv.style.width; g.style.height = cv.style.height; }
fitAll();

/* ---------- frame ---------- */
const FLASH = [CH.net[0], CH.dec1[0], CH.dec2[0]];                      // real-time flashes: the send, and back into 3D
const STORY_FLASH = [12, 14];                                           // the zoom-throughs into the replica and our lane (story time)
const DIPS = [CH.route[1], CH.blocks[1], CH.queue[1], CH.batch[1], CH.prefill[1], CH.kv[1], CH.dec1[1], CH.dec2[0], CH.dec2[1], CH.recap[1]];   // cuts between 3D and 2D: a quick dip to black
function seek(r) {
  r = clamp(r, 0, DURATION - 1e-6);
  ctx.setTransform(PX, 0, 0, PX, 0, 0);
  const j = jt(r), ha = JOURNEY.reduce((m, [a, b]) => Math.max(m, seg(r, a, a + .5) * (1 - seg(r, b - .5, b))), 0);
  if (j !== null) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.setTransform(PX, 0, 0, PX, 0, 0);
    world.frame(j);
    hud(j, ha); stageTitle(j, ha); timeline(j, ha); caption(r, JCAPS, H - 170);
    const sf = STORY_FLASH.filter(c => c <= j).at(-1);
    if (sf !== undefined) { const f = .28 * Math.exp(-(j - sf) * 16); if (f > .005) { ctx.fillStyle = '#DFF8FF'; ctx.globalAlpha = f; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }
  } else {
    background(r);
    if (r < CH.hook[1]) { const cam = hookCam(r); ctx.save(); ctx.translate(CX, CY); ctx.scale(cam.s, cam.s); ctx.translate(-cam.x, -cam.y); hook(r); ctx.restore(); }
    else if (r >= CH.blocks[0] && r < CH.blocks[1]) blocksScene(r - CH.blocks[0]);
    else if (r >= CH.batch[0] && r < CH.batch[1]) batchScene(r - CH.batch[0]);
    else if (r >= CH.kv[0] && r < CH.kv[1]) kvScene(r - CH.kv[0]);
    else if (r >= CH.spec[0] && r < CH.spec[1]) specScene(r - CH.spec[0]);
    else if (r >= CH.disagg[0] && r < CH.disagg[1]) disaggScene(r - CH.disagg[0]);
    else if (r >= CH.stream[0] && r < CH.stream[1]) streamScene(r - CH.stream[0]);
    else if (r >= CH.recap[0] && r < CH.recap[1]) recapScene(r - CH.recap[0]);
    else if (r >= CH.end[0]) endScene(r - CH.end[0]);
    GA = 1;
  }
  const flash = FLASH.reduce((m, c) => r >= c ? Math.min(m, r - c) : m, 99);
  const fl = .28 * Math.exp(-flash * 16); if (fl > .005) { ctx.fillStyle = '#DFF8FF'; ctx.globalAlpha = fl; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  const dip = DIPS.reduce((m, c) => Math.max(m, 1 - seg(Math.abs(r - c), 0, .3)), 0);
  const fadeIn = 1 - seg(r, 0, .3), fadeOut = seg(r, DURATION - .8, DURATION);
  const k = Math.max(dip, fadeIn, fadeOut);
  if (k > 0) { ctx.fillStyle = C.bg; ctx.globalAlpha = k; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}
// chapters for the YouTube guide (the guide isn't built yet; see brief-full.md)
window.CHAPTERS = [['Tracing one request', 0], ['Gateway and tokenizer', CH.gate[0]], ['Cache-aware routing', CH.route[0]], ['Queue and batching', CH.queue[0]],
  ['Prefill and the KV cache', CH.prefill[0]], ['Decode', CH.dec1[0]], ['Speculative decoding', CH.spec[0]], ['Prefill/decode disaggregation', CH.disagg[0]],
  ['Streaming back', CH.dec2[0]], ['Recap', CH.recap[0]]];
window.DURATION = DURATION; window.seek = seek; window.__ready = true;

/* ---------- preview controls (not used in capture) ---------- */
if (!CAPTURE) {
  const scrub = document.getElementById('scrub'), btn = document.getElementById('play'), tm = document.getElementById('time');
  scrub.max = DURATION; let playing = true, t0 = performance.now(), at = 0;
  const show = t => { seek(t); scrub.value = t; tm.textContent = `${t.toFixed(1)} / ${DURATION} s`; };
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? '⏸' : '▶'; t0 = performance.now() - at * 1000; };
  scrub.oninput = () => { at = +scrub.value; t0 = performance.now() - at * 1000; show(at); };
  addEventListener('resize', () => { fitAll(); show(at); });
  (function loop() { if (playing) { at = ((performance.now() - t0) / 1000) % DURATION; show(at); } requestAnimationFrame(loop); })();
}
