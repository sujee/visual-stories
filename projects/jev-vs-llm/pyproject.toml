[project]
name = "jev-vs-llm"
version = "0.1.0"
description = "Manim story: Jev, TypeSafe AI's System One model (typed decisions with calibrated probabilities)"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "manim==0.21.0",
    "numpy==2.4.6",
]

[tool.uv]
package = false
# Pin every transitive dependency to the exact versions the video is rendered with.
